<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samurai Survival - Brotato Style</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030508;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(74, 222, 128, 0.2);
      border: 3px solid #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #000;
      image-rendering: pixelated;
    }
    .instructions {
      margin-top: 14px;
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
    }
    .key {
      background: #1e293b;
      color: #facc15;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>
  <div class="instructions">
    การควบคุม: <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> หรือ <span class="key">ปุ่มลูกศร</span> เพื่อเคลื่อนที่ | อาวุธจะฟันและขว้างอัตโนมัติ!
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

    // --- GAME STATE ---
    const player = {
      x: 400, y: 250, vx: 0, vy: 0, speed: 2.8, facing: 'right',
      animFrame: 0, animTimer: 0, hit: 0,
      hp: 100, maxHp: 100, level: 1, exp: 0, nextExp: 10,
      attackCooldown: 0, attackRate: 25, attackDamage: 35, attackRange: 110,
      isAttacking: false, attackAngle: 0
    };

    const enemies = [];
    const expOrbs = [];
    const damageTexts = [];
    const enemyTypes = ['oni', 'tengu', 'kitsune'];
    let spawnTimer = 0;
    let gameTime = 0;

    // ระบบดาวกระจายหมุนรอบตัว (Orbiting Shuriken Weapon)
    const shurikens = [
      { angle: 0, dist: 55, speed: 0.06, damage: 15 },
      { angle: Math.PI, dist: 55, speed: 0.06, damage: 15 }
    ];

    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    // --- SPAWN LOGIC ---
    function spawnEnemy() {
      const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
      // เกิดรอบขอบจอ
      let x, y;
      if (Math.random() < 0.5) {
        x = Math.random() < 0.5 ? -30 : 830;
        y = Math.random() * 500;
      } else {
        x = Math.random() * 800;
        y = Math.random() < 0.5 ? -30 : 530;
      }

      let hp = 40 + gameTime * 0.5, radius = 20, speed = 1.2;
      if (type === 'oni') { hp *= 2.2; radius = 28; speed = 0.7; }
      else if (type === 'tengu') { hp *= 0.8; radius = 18; speed = 1.8; }
      else if (type === 'kitsune') { hp *= 0.7; radius = 16; speed = 1.4; }

      enemies.push({
        x: x, y: y, type: type, hp: hp, maxHp: hp,
        r: radius, speed: speed, animFrame: 0, animTimer: 0, hit: 0
      });
    }

    function addDamageText(x, y, text, color = '#facc15') {
      damageTexts.push({ x: x, y: y, text: text, color: color, life: 1.0, vy: -1 });
    }

    // ==========================================
    // 1. DRAW SAMURAI PLAYER
    // ==========================================
    function drawSamuraiPlayer() {
      const flip = player.facing === 'left';
      const anim = player.animFrame;
      const bob = (anim % 2 === 1) ? -1.5 : 0;

      ctx.save();
      ctx.translate(player.x, player.y);

      if (player.hit > 0 && Math.floor(player.hit * 25) % 2 === 0) ctx.globalAlpha = 0.4;

      // เงาสะท้อนใต้เท้า
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath(); ctx.ellipse(0, 16, 20, 6, 0, 0, Math.PI * 2); ctx.fill();

      if (flip) ctx.scale(-1, 1);

      // ผ้าคลุมพริ้วไหว
      ctx.fillStyle = '#090d16'; ctx.fillRect(-17, -12 + bob, 10, 20);
      ctx.fillStyle = '#1e293b'; ctx.fillRect(-16, -11 + bob, 8, 18);
      ctx.fillStyle = '#334155'; ctx.fillRect(-18 - anim, -9 + bob, 6, 15);

      // ขา & รองเท้า
      ctx.fillStyle = '#0f172a'; ctx.fillRect(-10, 8 + bob, 8, 7); ctx.fillRect(2, 8 + bob, 8, 7);
      ctx.fillStyle = '#451a03'; ctx.fillRect(-9, 14 + bob, 7, 3); ctx.fillRect(3, 14 + bob, 7, 3);

      // ชุดกิโมโน & เกราะอก
      ctx.fillStyle = '#0f172a'; ctx.fillRect(-9, -10 + bob, 18, 12);
      ctx.fillStyle = '#1e3a8a'; ctx.fillRect(-7, -10 + bob, 14, 11);
      ctx.fillStyle = '#2563eb'; ctx.fillRect(-5, -9 + bob, 10, 9);
      ctx.fillStyle = '#78350f'; ctx.fillRect(-8, 0 + bob, 16, 4);

      // หัว & หมวกเกราะ Kabuto
      ctx.fillStyle = '#450a0a'; ctx.fillRect(-4, -18 + bob, 10, 8); ctx.fillRect(-3, -17 + bob, 8, 6);
      ctx.fillStyle = '#0f172a'; ctx.fillRect(-9, -27 + bob, 17, 8);
      ctx.fillStyle = '#1e293b'; ctx.fillRect(-8, -26 + bob, 15, 6);
      ctx.fillStyle = '#b45309'; ctx.fillRect(1, -33 + bob, 3, 8); ctx.fillRect(-2, -31 + bob, 3, 5);
      ctx.fillStyle = '#38bdf8'; ctx.fillRect(3, -20 + bob, 2, 1); // ประกายตา

      // ดาบคาตานะ
      ctx.save();
      ctx.translate(4, -3 + bob);
      let katanaAngle = player.attackAngle;
      if (flip) katanaAngle = Math.PI - katanaAngle;
      ctx.rotate(katanaAngle);

      ctx.fillStyle = '#450a0a'; ctx.fillRect(-10, -2, 10, 4);
      ctx.fillStyle = '#b45309'; ctx.fillRect(0, -6, 3, 12);
      ctx.fillStyle = '#64748b'; ctx.fillRect(3, -2, 28, 3);
      ctx.fillStyle = '#f8fafc'; ctx.fillRect(3, -1, 28, 1);
      ctx.fillStyle = '#4ade80'; ctx.fillRect(3, 1, 27, 1);

      if (player.isAttacking) {
        ctx.fillStyle = 'rgba(74, 222, 128, 0.45)';
        ctx.beginPath(); ctx.arc(16, 0, 45, -Math.PI / 2.2, Math.PI / 2.2); ctx.fill();
      }
      ctx.restore();

      ctx.restore();

      // วาดดาวกระจายรอบตัว (Shurikens)
      shurikens.forEach(s => {
        const sx = player.x + Math.cos(s.angle) * s.dist;
        const sy = player.y + Math.sin(s.angle) * s.dist;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(Date.now() * 0.02);
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(-6, -2, 12, 4); ctx.fillRect(-2, -6, 4, 12);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(-2, -2, 4, 4);
        ctx.restore();
      });
    }

    // ==========================================
    // 2. DRAW YOKAI ENEMIES
    // ==========================================
    function drawYokaiEnemy(e) {
      const flip = player.x < e.x;
      const r = e.r;

      ctx.save();
      ctx.translate(e.x, e.y);

      if (e.hit > 0 && Math.floor(e.hit * 30) % 2 === 0) ctx.globalAlpha = 0.4;

      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.ellipse(0, r - 2, r * 1.1, 5, 0, 0, Math.PI * 2); ctx.fill();

      if (flip) ctx.scale(-1, 1);

      if (e.type === 'oni') {
        const bob = e.animFrame === 1 ? -2 : 0;
        ctx.fillStyle = '#7f1d1d'; ctx.fillRect(-18, -20 + bob, 36, 28);
        ctx.fillStyle = '#dc2626'; ctx.fillRect(-12, -18 + bob, 24, 22);
        ctx.fillStyle = '#d97706'; ctx.fillRect(-16, 7 + bob, 32, 10);
        ctx.fillStyle = '#18181b'; ctx.fillRect(-12, -48 + bob, 6, 15); ctx.fillRect(6, -48 + bob, 6, 15);
        ctx.fillStyle = '#feff00'; ctx.fillRect(-8, -28 + bob, 6, 6); ctx.fillRect(2, -28 + bob, 6, 6);
      } else if (e.type === 'tengu') {
        const bob = e.animFrame === 1 ? -4 : 0;
        ctx.fillStyle = '#020617'; ctx.fillRect(-24, -20 + bob, 10, 20); ctx.fillRect(14, -20 + bob, 10, 20);
        ctx.fillStyle = '#b91c1c'; ctx.fillRect(-8, -10 + bob, 16, 18);
        ctx.fillStyle = '#ef4444'; ctx.fillRect(-6, -23 + bob, 12, 10);
        ctx.fillStyle = '#b91c1c'; ctx.fillRect(6, -21 + bob, 16, 5);
      } else {
        const bob = e.animFrame === 1 ? -2 : 1;
        ctx.fillStyle = '#ea580c'; ctx.fillRect(-22, -16 + bob, 8, 14); ctx.fillRect(-18, -22 + bob, 6, 12);
        ctx.fillStyle = '#f97316'; ctx.fillRect(-8, -10 + bob, 16, 14);
        ctx.fillStyle = '#fffbeb'; ctx.fillRect(-4, -6 + bob, 8, 10);
        ctx.fillStyle = '#0284c7'; ctx.fillRect(2, -11 + bob, 5, 3);
      }

      ctx.restore();

      // HP Bar
      const bw = r * 1.8, bh = 3, hp = clamp(e.hp / e.maxHp, 0, 1);
      ctx.fillStyle = '#0f172a'; ctx.fillRect(e.x - bw / 2, e.y - r - 10, bw, bh);
      ctx.fillStyle = '#ef4444'; ctx.fillRect(e.x - bw / 2, e.y - r - 10, bw * hp, bh);
    }

    // ==========================================
    // 3. BACKGROUND & DROPS
    // ==========================================
    function drawBackground() {
      ctx.fillStyle = '#0b0f19';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // ตารางพื้นดิน
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
    }

    function drawExpOrbs() {
      expOrbs.forEach(orb => {
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath(); ctx.arc(orb.x, orb.y, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e0f2fe';
        ctx.beginPath(); ctx.arc(orb.x, orb.y, 2, 0, Math.PI * 2); ctx.fill();
      });
    }

    function drawUI() {
      // HP Bar
      ctx.fillStyle = '#0f172a'; ctx.fillRect(16, 16, 208, 18);
      ctx.fillStyle = '#ef4444'; ctx.fillRect(20, 20, 200 * (player.hp / player.maxHp), 10);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.fillText(`HP: ${Math.ceil(player.hp)}/${player.maxHp}`, 25, 29);

      // EXP Bar (ด้านบนสุด)
      ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, 8);
      ctx.fillStyle = '#38bdf8'; ctx.fillRect(0, 0, canvas.width * (player.exp / player.nextExp), 8);

      // Level & Time Info
      ctx.fillStyle = '#facc15'; ctx.font = 'bold 14px sans-serif';
      ctx.fillText(`LV. ${player.level}`, 240, 29);
      ctx.fillStyle = '#94a3b8';
      const mins = Math.floor(gameTime / 60), secs = Math.floor(gameTime % 60);
      ctx.fillText(`TIME: ${mins}:${secs < 10 ? '0' : ''}${secs}`, 700, 29);

      // Damage Numbers
      damageTexts.forEach(dt => {
        ctx.fillStyle = dt.color;
        ctx.font = 'bold 13px sans-serif';
        ctx.globalAlpha = dt.life;
        ctx.fillText(dt.text, dt.x, dt.y);
        ctx.globalAlpha = 1.0;
      });
    }

    // ==========================================
    // 4. UPDATE GAME LOGIC
    // ==========================================
    function update() {
      gameTime += 1 / 60;

      // การเคลื่อนที่ 8 ทิศทาง
      player.vx = 0; player.vy = 0;
      if (keys['KeyA'] || keys['ArrowLeft']) player.vx = -player.speed;
      if (keys['KeyD'] || keys['ArrowRight']) player.vx = player.speed;
      if (keys['KeyW'] || keys['ArrowUp']) player.vy = -player.speed;
      if (keys['KeyS'] || keys['ArrowDown']) player.vy = player.speed;

      if (player.vx !== 0 && player.vy !== 0) {
        player.vx *= 0.7071; player.vy *= 0.7071;
      }
      if (player.vx < 0) player.facing = 'left';
      if (player.vx > 0) player.facing = 'right';

      player.x = clamp(player.x + player.vx, 20, 780);
      player.y = clamp(player.y + player.vy, 20, 480);

      if (player.vx !== 0 || player.vy !== 0) {
        player.animTimer++;
        if (player.animTimer > 8) { player.animFrame = (player.animFrame + 1) % 4; player.animTimer = 0; }
      } else player.animFrame = 0;

      // ค้นหาศัตรูที่ใกล้ที่สุด (Auto-Targeting)
      let nearestEnemy = null, minDist = Infinity;
      enemies.forEach(e => {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < minDist) { minDist = d; nearestEnemy = e; }
      });

      // ระบบโจมตีดาบอัตโนมัติ
      if (player.attackCooldown > 0) player.attackCooldown--;
      if (nearestEnemy && minDist <= player.attackRange && player.attackCooldown <= 0) {
        player.isAttacking = true;
        player.attackCooldown = player.attackRate;
        player.attackAngle = Math.atan2(nearestEnemy.y - player.y, nearestEnemy.x - player.x);

        // ทำความเสียหายในระยะฟัน
        enemies.forEach(e => {
          if (Math.hypot(e.x - player.x, e.y - player.y) <= player.attackRange) {
            e.hp -= player.attackDamage;
            e.hit = 0.2;
            e.x += Math.cos(player.attackAngle) * 15;
            e.y += Math.sin(player.attackAngle) * 15;
            addDamageText(e.x, e.y - 10, Math.floor(player.attackDamage));
          }
        });
      } else if (player.attackCooldown < player.attackRate - 8) {
        player.isAttacking = false;
      }

      // ระบบดาวกระจายหมุนรอบตัว
      shurikens.forEach(s => {
        s.angle += s.speed;
        const sx = player.x + Math.cos(s.angle) * s.dist;
        const sy = player.y + Math.sin(s.angle) * s.dist;

        enemies.forEach(e => {
          if (Math.hypot(e.x - sx, e.y - sy) < e.r + 8) {
            e.hp -= s.damage;
            e.hit = 0.15;
            addDamageText(e.x, e.y - 10, Math.floor(s.damage), '#38bdf8');
          }
        });
      });

      // การจัดการศัตรู
      spawnTimer++;
      if (spawnTimer > Math.max(15, 60 - gameTime * 0.5)) {
        spawnEnemy();
        spawnTimer = 0;
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        e.animTimer++;
        if (e.animTimer > 10) { e.animFrame = (e.animFrame + 1) % 2; e.animTimer = 0; }
        if (e.hit > 0) e.hit -= 0.02;

        // ชนตัวซามูไร
        if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + 10 && player.hit <= 0) {
          player.hp -= 10;
          player.hit = 0.4;
          addDamageText(player.x, player.y - 15, '-10', '#ef4444');
        }

        // ศัตรูตาย -> ดรอป EXP
        if (e.hp <= 0) {
          expOrbs.push({ x: e.x, y: e.y, value: 5 });
          enemies.splice(i, 1);
        }
      }

      // ระบบดูดผลึก EXP (Magnet & Level Up)
      for (let i = expOrbs.length - 1; i >= 0; i--) {
        const orb = expOrbs[i];
        const dist = Math.hypot(orb.x - player.x, orb.y - player.y);
        if (dist < 100) { // ระยะดูด
          orb.x += (player.x - orb.x) * 0.12;
          orb.y += (player.y - orb.y) * 0.12;
        }
        if (dist < 15) {
          player.exp += orb.value;
          expOrbs.splice(i, 1);

          if (player.exp >= player.nextExp) {
            player.level++;
            player.exp -= player.nextExp;
            player.nextExp = Math.floor(player.nextExp * 1.3);
            player.attackDamage += 8;
            player.attackRate = Math.max(10, player.attackRate - 2);
            player.hp = Math.min(player.maxHp, player.hp + 20);
            addDamageText(player.x, player.y - 25, 'LEVEL UP!', '#4ade80');
          }
        }
      }

      // Damage Text Animation
      for (let i = damageTexts.length - 1; i >= 0; i--) {
        const dt = damageTexts[i];
        dt.y += dt.vy; dt.life -= 0.03;
        if (dt.life <= 0) damageTexts.splice(i, 1);
      }

      if (player.hit > 0) player.hit -= 0.02;
      if (player.hp <= 0) player.hp = 0;
    }

    function gameLoop() {
      update();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      drawExpOrbs();
      drawSamuraiPlayer();
      enemies.forEach(e => drawYokaiEnemy(e));
      drawUI();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111923"><title>Stillpoint — Shard Garden</title>
<style>
:root{--ink:#eaf0f4;--muted:#9baab7;--mint:#9ce5d2;--gold:#f4d49a;--bg:#111923}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}button{font:inherit;border:0;cursor:pointer}#app{height:100dvh;max-width:900px;margin:auto;display:flex;flex-direction:column}header{height:66px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 15px;background:#182330;border-bottom:1px solid #ffffff12}.brand{font-size:18px;font-weight:900;letter-spacing:2px}.sub{font-size:9px;color:var(--muted);letter-spacing:1.5px;margin-top:3px}.stats{display:flex;gap:13px;text-align:right;font-size:9px;color:var(--muted)}.stats b{display:block;color:var(--mint);font-size:16px;margin-top:3px}#garden{position:relative;flex:1;min-height:220px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#344c57,#172634 75%)}#scene{width:100%;height:100%;display:block;touch-action:none}#prompt{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:1px;color:#d1e4df;pointer-events:none;text-shadow:0 2px 8px #000}#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:8px 13px;background:#101820ed;border:1px solid #ffffff2a;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:4}#toast.show{opacity:1}.hudline{height:35px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 13px;background:#1b2935;color:var(--muted);font-size:10px}.hudline b{color:var(--gold)}nav{height:52px;flex:none;display:flex;background:#1b2834;border-top:1px solid #ffffff12}nav button{flex:1;background:transparent;color:#9eacb8;font-size:10px;font-weight:800;letter-spacing:.8px}nav button.active{color:var(--mint);background:#263744;box-shadow:inset 0 -3px var(--mint)}#content{height:225px;max-height:29dvh;min-height:175px;overflow:auto;flex:none;padding:11px;background:#18232e}.heading{display:flex;justify-content:space-between;align-items:center;margin:0 2px 9px;font-size:11px;letter-spacing:1px;color:#c5d2d9}.hint{font-size:9px;color:var(--muted);letter-spacing:0}.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px}.panel,.card{border:1px solid #3b4c59;background:linear-gradient(145deg,#293946,#1c2935);border-radius:11px;padding:10px}.card{flex:0 0 130px;text-align:center}.gem{width:32px;height:38px;margin:1px auto 6px;clip-path:polygon(50% 0,91% 24%,100% 70%,50% 100%,0 70%,9% 24%);background:linear-gradient(135deg,#effff8,#8bd8c5 48%,#457f91)}.card b,.panel b{font-size:11px}.desc{font-size:9px;color:var(--muted);line-height:1.45;margin-top:4px}.btn{background:#8fdcc8;color:#13252b;font-weight:900;border-radius:8px;padding:9px 11px;font-size:10px;letter-spacing:.4px}.btn:disabled{opacity:.35}.panel{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:7px}.tag{font-size:9px;color:var(--gold);border:1px solid #f4d49a55;border-radius:20px;padding:5px 8px}.progress{height:7px;background:#0e1821;border-radius:8px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#6eb9aa,#e2d19f);width:0%}.mutedbtn{background:#344653;color:#dce8e8;border-radius:8px;padding:9px;font-size:10px;font-weight:800}@media(min-width:700px){#content{height:235px;max-height:235px}}
</style></head><body><div id="app"><header><div><div class="brand">STILLPOINT</div><div class="sub">SHARD GARDEN · BUILD 0.3.0</div></div><div class="stats"><div>ESSENCE<b id="essence">0</b></div><div>PER SEC<b id="flow">0</b></div></div></header>
<section id="garden"><canvas id="scene"></canvas><div id="toast"></div><div id="prompt">TAP TO GATHER · DRAG MATCHING SHARDS TO MERGE</div></section>
<div class="hudline"><span id="rank">GARDEN RANK 1</span><span>BEST SHARD <b id="best">LV 0</b></span><span id="goal">NEXT: 100 ESSENCE</span></div>
<nav><button class="active" data-tab="garden">GARDEN</button><button data-tab="growth">GROWTH</button><button data-tab="quests">GOALS</button><button data-tab="archive">ARCHIVE</button></nav><main id="content"></main></div>
<script>
(function(){"use strict";
const $=q=>document.querySelector(q),fmt=n=>n>=1e9?(n/1e9).toFixed(2)+"B":n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":Math.floor(n).toLocaleString();
const fresh={essence:0,lifetime:0,crystals:[{id:1,level:0,x:.30,y:.43},{id:2,level:0,x:.70,y:.43},{id:3,level:0,x:.50,y:.72}],next:4,up:{touch:0,flow:0,attune:0},last:Date.now(),merges:0,claimed:[]};let s;
try{s=Object.assign({},fresh,JSON.parse(localStorage.getItem("stillpointGarden")||"{}"));s.up=Object.assign({},fresh.up,s.up||{});if(!Array.isArray(s.crystals))s.crystals=[];s.crystals=s.crystals.filter(c=>c&&Number.isFinite(+c.id)&&Number.isFinite(+c.level)).map(c=>({id:+c.id,level:Math.max(0,Math.floor(+c.level)),x:Number.isFinite(+c.x)?+c.x:Math.random()*.7+.15,y:Number.isFinite(+c.y)?+c.y:Math.random()*.5+.25}));if(!Array.isArray(s.claimed))s.claimed=[]}catch(e){s=JSON.parse(JSON.stringify(fresh))}
if(!s.crystals.length)s.crystals=fresh.crystals.map(c=>({...c}));s.essence=Math.max(0,Number(s.essence)||0);s.lifetime=Math.max(0,Number(s.lifetime)||0);s.next=Math.max(1,Math.floor(Number(s.next)||4));s.merges=Math.max(0,Number(s.merges)||0);["touch","flow","attune"].forEach(k=>s.up[k]=Math.max(0,Math.floor(Number(s.up[k])||0)));
let tab="garden",toastTimer=0,drag=null,pointer=null,W=0,H=0,dpr=1,particles=[],last=0;
const canvas=$("#scene"),ctx=canvas.getContext("2d");
function rate(c){return Math.pow(2.15,c.level)*(1+s.up.attune*.18)}
function flow(){return s.crystals.reduce((a,c)=>a+rate(c),0)*(1+s.up.flow*.15)}
function save(){s.last=Date.now();try{localStorage.setItem("stillpointGarden",JSON.stringify(s))}catch(e){}}
function say(t){let el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),1500)}
function collect(n){s.essence+=n;s.lifetime+=n;stats()}
function stats(){ $("#essence").textContent=fmt(s.essence);$("#flow").textContent=fmt(flow());let best=Math.max(0,...s.crystals.map(c=>c.level));$("#best").textContent="LV "+best;let rank=1+Math.floor(Math.sqrt(s.lifetime/500));$("#rank").textContent="GARDEN RANK "+rank;let target=100*Math.pow(3,Math.floor(s.lifetime/100));$("#goal").textContent="NEXT: "+fmt(target)+" ESSENCE"}
function burst(x,y){for(let i=0;i<22;i++){let a=Math.random()*Math.PI*2,v=25+Math.random()*110;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.45+Math.random()*.5,max:.9,size:1+Math.random()*3})}}
function costPlant(){return Math.floor(30*Math.pow(1.8,Math.max(0,s.crystals.length-3)))}
function plant(){if(s.crystals.length>=15){say("Garden is full — merge shards first");return}let p=costPlant();if(s.essence<p){say("Not enough essence");return}s.essence-=p;let a=Math.random()*Math.PI*2,r=.2+Math.random()*.17;s.crystals.push({id:s.next++,level:0,x:Math.max(.12,Math.min(.88,.5+Math.cos(a)*r)),y:Math.max(.18,Math.min(.78,.52+Math.sin(a)*r))});paint();save();say("A new shard has grown")}
function upgrade(k){let base={touch:35,flow:90,attune:120}[k],price=Math.floor(base*Math.pow(1.8,s.up[k]));if(s.essence<price)return;s.essence-=price;s.up[k]++;paint();save();say("Garden strengthened")}
function merge(a,b){if(a.id===b.id||a.level!==b.level)return false;let x=(a.x+b.x)/2,y=(a.y+b.y)/2,lv=a.level+1;s.crystals=s.crystals.filter(c=>c.id!==a.id&&c.id!==b.id);s.crystals.push({id:s.next++,level:lv,x,y});s.merges++;collect(Math.pow(2,lv)*5);burst(x*W,y*H);say("MERGED! · SHARD LEVEL "+lv);paint();save();return true}
function paint(){stats();let root=$("#content");if(tab==="garden"){let p=costPlant();root.innerHTML='<div class="heading"><span>SHARD GARDEN · '+s.crystals.length+'/15</span><span class="hint">Drag same-level shards together</span></div><div class="panel"><div><b>Grow a new shard</b><div class="desc">More shards create more passive Essence.</div></div><button class="btn" id="plant" '+(s.essence<p||s.crystals.length>=15?"disabled":"")+'>PLANT · '+fmt(p)+'</button></div><div class="desc">Tip: tap empty space to gather Essence. Tap a shard for bonus Essence. Drag one onto another matching shard to merge.</div>' ;$("#plant").onclick=plant}
else if(tab==="growth"){let defs=[["touch","Gentle Touch","Tap gains +2 Essence per level.",35],["flow","Living Current","All shard production +15% per level.",90],["attune","Prism Attunement","Each shard produces +18% per level.",120]];root.innerHTML='<div class="heading"><span>PERMANENT UPGRADES</span><span class="tag">LEVELS SAVE</span></div>';defs.forEach(d=>{let lv=s.up[d[0]],p=Math.floor(d[3]*Math.pow(1.8,lv)),el=document.createElement("div");el.className="panel";el.innerHTML='<div><b>'+d[1]+' · Lv '+lv+'</b><div class="desc">'+d[2]+'</div></div><button class="btn" '+(s.essence<p?"disabled":"")+'>UPGRADE · '+fmt(p)+'</button>';el.querySelector("button").onclick=()=>upgrade(d[0]);root.append(el)})}
else if(tab==="quests"){let goals=[{id:"first",name:"First harvest",desc:"Gather 100 lifetime Essence",v:s.lifetime,need:100,reward:50},{id:"merge",name:"Resonance",desc:"Merge 3 shards",v:s.merges,need:3,reward:100},{id:"level3",name:"A brighter shard",desc:"Create a Level 3 shard",v:Math.max(0,...s.crystals.map(c=>c.level)),need:3,reward:180},{id:"garden",name:"A living garden",desc:"Grow 8 shards at once",v:s.crystals.length,need:8,reward:250}];root.innerHTML='<div class="heading"><span>GARDEN CHALLENGES</span><span class="tag">'+s.claimed.length+'/4 CLAIMED</span></div>';goals.forEach(g=>{let done=g.v>=g.need,claimed=s.claimed.includes(g.id),el=document.createElement("div");el.className="panel";el.innerHTML='<div style="flex:1"><b>'+g.name+'</b><div class="desc">'+g.desc+' · '+Math.min(g.v,g.need)+'/'+g.need+'</div><div class="progress"><i style="width:'+Math.min(100,g.v/g.need*100)+'%"></i></div></div><button class="btn" '+(!done||claimed?"disabled":"")+'>'+(claimed?"CLAIMED":done?"CLAIM · "+g.reward:"IN PROGRESS")+'</button>';el.querySelector("button").onclick=()=>{if(done&&!claimed){s.claimed.push(g.id);collect(g.reward);paint();save();say("Challenge reward +"+g.reward)}};root.append(el)})}
else{let best=Math.max(0,...s.crystals.map(c=>c.level));root.innerHTML='<div class="heading"><span>GARDEN ARCHIVE</span><span class="tag">RANK '+(1+Math.floor(Math.sqrt(s.lifetime/500)))+'</span></div><div class="panel"><div><b>Lifetime Essence</b><div class="desc">'+fmt(s.lifetime)+' gathered so far</div></div><span class="tag">'+s.merges+' MERGES</span></div><div class="panel"><div><b>Highest resonance</b><div class="desc">Your strongest shard so far</div></div><span class="tag">LEVEL '+best+'</span></div><div class="panel"><div><b>Reset garden</b><div class="desc">Erase this device's save and start over.</div></div><button class="mutedbtn" id="reset">RESET</button></div>';$("#reset").onclick=()=>{if(confirm("Reset all Stillpoint progress on this device?")){localStorage.removeItem("stillpointGarden");s=JSON.parse(JSON.stringify(fresh));paint();say("A new garden begins")}}}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));paint()});
function resize(){let r=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.max(1,Math.floor(W*dpr));canvas.height=Math.max(1,Math.floor(H*dpr));ctx.setTransform(dpr,0,0,dpr,0,0)}
function drawGem(x,y,r,level,selected){ctx.save();ctx.translate(x,y);let hue=(level*39)%360;ctx.shadowColor="hsla("+hue+",80%,75%,.65)";ctx.shadowBlur=selected?28:13;ctx.beginPath();for(let i=0;i<6;i++){let a=-Math.PI/2+i*Math.PI/3;let px=Math.cos(a)*r,py=Math.sin(a)*r*1.18;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath();let g=ctx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,"hsl("+hue+",80%,95%)");g.addColorStop(.48,"hsl("+hue+",55%,68%)");g.addColorStop(1,"hsl("+(hue+25)+",55%,35%)");ctx.fillStyle=g;ctx.fill();ctx.strokeStyle="#effff0";ctx.globalAlpha=.75;ctx.lineWidth=1.4;ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle="#10232a";ctx.font="bold "+Math.max(9,r*.48)+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(level,x?0:0,1);ctx.restore()}
function draw(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;ctx.clearRect(0,0,W,H);let g=ctx.createRadialGradient(W*.5,H*.45,5,W*.5,H*.45,Math.max(W,H)*.7);g.addColorStop(0,"#45636a");g.addColorStop(1,"#172634");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle="#a4e7d4";ctx.globalAlpha=.12;ctx.beginPath();ctx.ellipse(W/2,H*.52,W*.34,H*.19,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
for(let i=0;i<16;i++){let x=(i*83+31)%W,y=(i*47+19)%H;ctx.fillStyle="#d7fff0";ctx.globalAlpha=.16+.12*Math.sin(t*.001+i);ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;
s.crystals.forEach(c=>{let x=c.x*W,y=c.y*H,r=17+Math.min(c.level,8)*2.2;let bob=Math.sin(t*.0015+c.id)*2.5;drawGem(x,y+bob,r,c.level,drag&&drag.id===c.id);ctx.fillStyle="#eaf4ed";ctx.font="10px sans-serif";ctx.textAlign="center";ctx.fillText("LV "+c.level,x,y+r+13)});
if(drag){let c=s.crystals.find(x=>x.id===drag.id);if(c){drawGem(pointer.x,pointer.y,20+Math.min(c.level,8)*2,c.level,true);ctx.strokeStyle="#f4d49a";ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(pointer.x,pointer.y,31,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}}
particles=particles.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle="#f4d49a";ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();return p.life>0});ctx.globalAlpha=1;requestAnimationFrame(draw)}
function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function nearest(p){let found=null,dist=1e9;s.crystals.forEach(c=>{let d=Math.hypot(c.x*W-p.x,c.y*H-p.y);if(d<Math.max(28,20+Math.min(c.level,8)*2)&&d<dist){found=c;dist=d}});return found}
canvas.addEventListener("pointerdown",e=>{e.preventDefault();let p=pos(e),c=nearest(p);pointer=p;if(c){drag={id:c.id,start:p,moved:false};canvas.setPointerCapture(e.pointerId)}else{collect(1+s.up.touch*2);burst(p.x,p.y);say("+ "+(1+s.up.touch*2)+" Essence");save()}});
canvas.addEventListener("pointermove",e=>{if(!drag)return;pointer=pos(e);if(Math.hypot(pointer.x-drag.start.x,pointer.y-drag.start.y)>8)drag.moved=true});
canvas.addEventListener("pointerup",e=>{if(!drag)return;let d=drag,c=s.crystals.find(x=>x.id===d.id),p=pos(e),target=nearest(p);drag=null;if(d.moved&&c&&target&&target.id!==c.id&&target.level===c.level){merge(c,target)}else if(d.moved&&c){c.x=Math.max(.08,Math.min(.92,p.x/W));c.y=Math.max(.12,Math.min(.82,p.y/H));save()}else if(c){let bonus=2+s.up.touch*2+Math.pow(2,c.level);collect(bonus);burst(c.x*W,c.y*H);say("Shard resonance +"+fmt(bonus));save()}});
canvas.addEventListener("pointercancel",()=>{drag=null});
function tick(){let now=Date.now(),away=Math.max(0,Math.min(86400,(now-(s.last||now))/1000));if(away>0){let gain=flow()*away;s.essence+=gain;s.lifetime+=gain;s.last=now;stats()}save()}
window.addEventListener("resize",resize);resize();paint();let away=Math.max(0,Math.min(86400,(Date.now()-s.last)/1000));if(away>5){let gain=flow()*away;s.essence+=gain;s.lifetime+=gain;say("Welcome back · +"+fmt(gain)+" Essence")}s.last=Date.now();stats();save();setInterval(()=>{let gain=flow();s.essence+=gain;s.lifetime+=gain;s.last=Date.now();stats();if(tab==="quests")paint();save()},1000);requestAnimationFrame(draw);
})();</script></body></html>

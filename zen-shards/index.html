<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111923"><title>Stillpoint — Shard Garden</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111923;color:#eaf0f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:auto}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:11px 13px;background:#9ce5d2;color:#13252b;font-weight:800}#app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}header{padding:14px;background:#1b2935;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:2px;font-size:19px}.sub{color:#9baab7;font-size:10px;margin-top:3px;letter-spacing:1px}.stats{display:flex;gap:14px;text-align:right;font-size:9px;color:#9baab7}.stats b{display:block;color:#9ce5d2;font-size:17px;margin-top:3px}#scene{display:block;width:100%;height:310px;background:radial-gradient(ellipse,#344c57,#172634);touch-action:none}#hint{padding:9px;text-align:center;background:#20313d;color:#d3e8df;font-size:11px}nav{display:flex;background:#1b2834;position:sticky;top:0;z-index:3}nav button{flex:1;border-radius:0;background:#1b2834;color:#9baab7;padding:14px 2px;font-size:10px}nav button.active{color:#9ce5d2;background:#263744;border-bottom:3px solid #9ce5d2}main{padding:13px;min-height:270px}.heading{display:flex;justify-content:space-between;gap:8px;margin:2px 0 12px;font-size:12px;color:#dce9e7}.panel,.card{background:#202e3a;border:1px solid #3b4c59;border-radius:11px;padding:12px;margin-bottom:9px}.panel{display:flex;justify-content:space-between;align-items:center;gap:10px}.panel b,.card b{font-size:13px}.desc,small{display:block;color:#aab8c1;font-size:11px;line-height:1.5;margin-top:4px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}.card{text-align:center;margin:0}.gem{width:35px;height:42px;margin:0 auto 7px;clip-path:polygon(50% 0,91% 24%,100% 70%,50% 100%,0 70%,9% 24%);background:linear-gradient(135deg,#effff8,#8bd8c5 48%,#457f91)}.card button{width:100%;margin-top:9px;padding:9px 3px;font-size:10px}.secondary{background:#344653;color:#eaf0f4}.bar{height:7px;background:#101820;border-radius:8px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:#9ce5d2}.toast{position:fixed;z-index:9;bottom:18px;left:50%;transform:translateX(-50%);background:#0b1219;border:1px solid #52636b;border-radius:20px;padding:10px 15px;display:none;font-size:12px;max-width:90%;text-align:center}#fatal{display:none;background:#572f36;padding:12px;margin:10px;border-radius:8px;font-size:12px}
</style></head><body><div id="app"><header><div><div class="brand">STILLPOINT</div><div class="sub">SHARD GARDEN · BUILD 0.3.1</div></div><div class="stats"><div>ESSENCE<b id="essence">0</b></div><div>PER SEC<b id="flow">0</b></div></div></header><canvas id="scene"></canvas><div id="hint">TAP EMPTY SPACE TO GATHER · DRAG MATCHING SHARDS TO MERGE</div><nav><button class="active" data-tab="garden">GARDEN</button><button data-tab="growth">GROWTH</button><button data-tab="goals">GOALS</button><button data-tab="archive">ARCHIVE</button></nav><main id="content"><div class="heading">YOUR GARDEN <span>Loading…</span></div></main><div id="fatal"></div></div><div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)},tab="garden",drag=null,pointer=null,W=1,H=1,ctx=null,last=0,toastTimer=0;
var fresh={essence:0,lifetime:0,crystals:[{id:1,level:0,x:.28,y:.45},{id:2,level:0,x:.72,y:.45},{id:3,level:0,x:.5,y:.72}],next:4,up:{touch:0,flow:0},merges:0,claimed:[],last:Date.now()},s;
function say(t){var e=$("toast");e.innerHTML=t;e.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(function(){e.style.display="none"},1500)}
function fmt(n){return Math.floor(n).toLocaleString()}
function load(){s={essence:0,lifetime:0,crystals:fresh.crystals.map(function(c){return{id:c.id,level:c.level,x:c.x,y:c.y}}),next:4,up:{touch:0,flow:0},merges:0,claimed:[],last:Date.now()};try{var raw=localStorage.getItem("stillpointGarden"),v=raw?JSON.parse(raw):null;if(v&&typeof v==="object"){s.essence=Math.max(0,Number(v.essence)||0);s.lifetime=Math.max(0,Number(v.lifetime)||0);s.next=Math.max(4,Number(v.next)||4);s.merges=Math.max(0,Number(v.merges)||0);s.up.touch=Math.max(0,Number(v.up&&v.up.touch)||0);s.up.flow=Math.max(0,Number(v.up&&v.up.flow)||0);if(Object.prototype.toString.call(v.crystals)==="[object Array]"&&v.crystals.length){s.crystals=v.crystals.slice(0,15).map(function(c,i){return{id:Number(c.id)||i+1,level:Math.max(0,Number(c.level)||0),x:isFinite(Number(c.x))?Number(c.x):.5,y:isFinite(Number(c.y))?Number(c.y):.5}})}s.claimed=Object.prototype.toString.call(v.claimed)==="[object Array]"?v.claimed:[];s.last=Number(v.last)||Date.now()}}catch(e){s.last=Date.now()}}
function rate(c){return Math.pow(2,c.level)*(1+s.up.flow*.15)}
function flow(){var n=0,i;for(i=0;i<s.crystals.length;i++)n+=rate(s.crystals[i]);return n}
function save(){s.last=Date.now();try{localStorage.setItem("stillpointGarden",JSON.stringify(s))}catch(e){}}
function stats(){$("essence").textContent=fmt(s.essence);$("flow").textContent=fmt(flow());}
function gain(n){s.essence+=n;s.lifetime+=n;stats();save()}
function plantCost(){return Math.floor(30*Math.pow(1.7,Math.max(0,s.crystals.length-3)))}
function plant(){var p=plantCost();if(s.crystals.length>=15||s.essence<p){say("Need "+p+" Essence to plant");return}s.essence-=p;s.crystals.push({id:s.next++,level:0,x:.15+Math.random()*.7,y:.2+Math.random()*.6});paint();save();say("New shard planted")}
function merge(a,b){if(!a||!b||a.id===b.id||a.level!==b.level)return false;var lv=a.level+1,x=(a.x+b.x)/2,y=(a.y+b.y)/2,i,out=[];for(i=0;i<s.crystals.length;i++)if(s.crystals[i].id!==a.id&&s.crystals[i].id!==b.id)out.push(s.crystals[i]);out.push({id:s.next++,level:lv,x:x,y:y});s.crystals=out;s.merges++;gain(5*Math.pow(2,lv));paint();say("Merged! Level "+lv);return true}
function upgrade(k){var base=k==="touch"?35:90,p=Math.floor(base*Math.pow(1.8,s.up[k]));if(s.essence<p){say("Not enough Essence");return}s.essence-=p;s.up[k]++;paint();save()}
function paint(){stats();var root=$("content"),i,c,html="",defs,goals;
if(tab==="garden"){html='<div class="heading">YOUR SHARDS <span>'+s.crystals.length+'/15 · Drag to merge</span></div><div class="cards">';for(i=0;i<s.crystals.length;i++){c=s.crystals[i];html+='<div class="card"><div class="gem"></div><b>Prism · Lv '+c.level+'</b><small>'+fmt(rate(c))+' Essence/sec</small><button class="secondary" data-collect="'+c.id+'">COLLECT</button></div>'}html+='</div><div class="panel" style="margin-top:10px"><div><b>Plant a shard</b><div class="desc">Grow your garden and increase passive income.</div></div><button id="plant" '+(s.crystals.length>=15||s.essence<plantCost()?"disabled":"")+'>PLANT · '+fmt(plantCost())+'</button></div>';root.innerHTML=html;$("plant").onclick=plant;var buttons=root.querySelectorAll("[data-collect]");for(i=0;i<buttons.length;i++)buttons[i].onclick=(function(id){return function(){var x=null,j;for(j=0;j<s.crystals.length;j++)if(s.crystals[j].id===id)x=s.crystals[j];if(x){gain(2+s.up.touch*2+Math.pow(2,x.level));say("Shard collected")}}})(Number(buttons[i].getAttribute("data-collect")))}
else if(tab==="growth"){defs=[["touch","Gentle Touch","Tap a shard for more Essence.",35],["flow","Living Current","All shard production +15% per level.",90]];html='<div class="heading">PERMANENT UPGRADES</div>';for(i=0;i<defs.length;i++){var d=defs[i],lv=s.up[d[0]],p=Math.floor(d[3]*Math.pow(1.8,lv));html+='<div class="panel"><div><b>'+d[1]+' · Lv '+lv+'</b><div class="desc">'+d[2]+'</div></div><button data-up="'+d[0]+'" '+(s.essence<p?"disabled":"")+'>UPGRADE · '+fmt(p)+'</button></div>'}root.innerHTML=html;var ups=root.querySelectorAll("[data-up]");for(i=0;i<ups.length;i++)ups[i].onclick=(function(k){return function(){upgrade(k)}})(ups[i].getAttribute("data-up"))}
else if(tab==="goals"){goals=[{id:"harvest",name:"First harvest",desc:"Gather 100 lifetime Essence",v:s.lifetime,n:100,r:50},{id:"merge",name:"First resonance",desc:"Merge 3 pairs of shards",v:s.merges,n:3,r:120},{id:"level",name:"Bright shard",desc:"Own a Level 3 shard",v:0,n:3,r:180},{id:"many",name:"Garden keeper",desc:"Own 8 shards",v:s.crystals.length,n:8,r:250}];for(i=0;i<goals.length;i++)if(goals[i].id==="level")for(var j=0;j<s.crystals.length;j++)goals[i].v=Math.max(goals[i].v,s.crystals[j].level);html='<div class="heading">GARDEN GOALS</div>';for(i=0;i<goals.length;i++){d=goals[i];var done=d.v>=d.n,claimed=s.claimed.indexOf(d.id)>=0;html+='<div class="panel"><div style="flex:1"><b>'+d.name+'</b><div class="desc">'+d.desc+' · '+Math.min(d.v,d.n)+'/'+d.n+'</div><div class="bar"><i style="width:'+Math.min(100,d.v/d.n*100)+'%"></i></div></div><button data-claim="'+d.id+'" '+(!done||claimed?"disabled":"")+'>'+(claimed?"CLAIMED":done?"CLAIM +"+d.r:"LOCKED")+'</button></div>'}root.innerHTML=html;var claims=root.querySelectorAll("[data-claim]");for(i=0;i<claims.length;i++)claims[i].onclick=(function(id){return function(){var g=null,k;for(k=0;k<goals.length;k++)if(goals[k].id===id)g=goals[k];if(g&&s.claimed.indexOf(id)<0){s.claimed.push(id);gain(g.r);paint()}}})(claims[i].getAttribute("data-claim"))}
else{var best=0;for(i=0;i<s.crystals.length;i++)best=Math.max(best,s.crystals[i].level);root.innerHTML='<div class="heading">GARDEN ARCHIVE</div><div class="panel"><div><b>Lifetime Essence</b><div class="desc">'+fmt(s.lifetime)+' gathered</div></div></div><div class="panel"><div><b>Highest shard</b><div class="desc">Your best resonance level</div></div><b>LV '+best+'</b></div><div class="panel"><div><b>Reset save</b><div class="desc">Start a new garden on this device.</div></div><button class="secondary" id="reset">RESET</button></div>';$("reset").onclick=function(){if(confirm("Erase your Stillpoint save?")){localStorage.removeItem("stillpointGarden");location.reload()}}}}
function resize(){var cv=$("scene"),r=cv.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);var d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.floor(W*d);cv.height=Math.floor(H*d);ctx=cv.getContext("2d");ctx.setTransform(d,0,0,d,0,0)}
function gem(x,y,r,lv,selected){ctx.save();ctx.translate(x,y);var h=(lv*43)%360;ctx.shadowColor="hsla("+h+",85%,75%,.8)";ctx.shadowBlur=selected?24:12;ctx.beginPath();for(var i=0;i<6;i++){var a=-Math.PI/2+i*Math.PI/3,px=Math.cos(a)*r,py=Math.sin(a)*r*1.15;if(!i)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath();var g=ctx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,"hsl("+h+",90%,95%)");g.addColorStop(.5,"hsl("+h+",60%,65%)");g.addColorStop(1,"hsl("+(h+20)+",55%,35%)");ctx.fillStyle=g;ctx.fill();ctx.strokeStyle="#effff0";ctx.stroke();ctx.fillStyle="#10232a";ctx.font="bold 11px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(" "+lv,0,1);ctx.restore()}
function draw(t){if(!ctx)return;var dt=Math.min(.05,(t-last)/1000||.016);last=t;ctx.clearRect(0,0,W,H);var bg=ctx.createRadialGradient(W/2,H/2,5,W/2,H/2,Math.max(W,H)*.7);bg.addColorStop(0,"#45636a");bg.addColorStop(1,"#172634");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle="#a4e7d4";ctx.globalAlpha=.18;ctx.beginPath();ctx.ellipse(W/2,H*.55,W*.34,H*.18,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;for(var i=0;i<s.crystals.length;i++){var c=s.crystals[i],x=c.x*W,y=c.y*H+Math.sin(t*.001+c.id)*2;gem(x,y,19+Math.min(7,c.level)*2,c.level,drag&&drag.id===c.id);ctx.fillStyle="#eaf4ed";ctx.font="10px sans-serif";ctx.textAlign="center";ctx.fillText("LV "+c.level,x,y+32)}if(drag){var dc=null;for(i=0;i<s.crystals.length;i++)if(s.crystals[i].id===drag.id)dc=s.crystals[i];if(dc)gem(pointer.x,pointer.y,21,dc.level,true)}requestAnimationFrame(draw)}
function pos(e){var r=$("scene").getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function near(p){var best=null,dist=1e9;for(var i=0;i<s.crystals.length;i++){var c=s.crystals[i],d=Math.sqrt(Math.pow(c.x*W-p.x,2)+Math.pow(c.y*H-p.y,2));if(d<36&&d<dist){best=c;dist=d}}return best}
function start(){load();var away=Math.max(0,Math.min(86400,(Date.now()-s.last)/1000));if(away>5){var bonus=flow()*away;s.essence+=bonus;s.lifetime+=bonus;say("Welcome back · +"+fmt(bonus)+" Essence")}s.last=Date.now();document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){tab=b.getAttribute("data-tab");document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("active",x===b)});paint()}});resize();window.addEventListener("resize",resize);var cv=$("scene");cv.addEventListener("pointerdown",function(e){e.preventDefault();var p=pos(e),c=near(p);if(c){drag={id:c.id,from:p,moved:false};pointer=p;cv.setPointerCapture(e.pointerId)}else{gain(1+s.up.touch*2);say("+"+(1+s.up.touch*2)+" Essence")}});cv.addEventListener("pointermove",function(e){if(drag){pointer=pos(e);if(Math.hypot(pointer.x-drag.from.x,pointer.y-drag.from.y)>7)drag.moved=true}});cv.addEventListener("pointerup",function(e){if(!drag)return;var d=drag,p=pos(e),c=null,target=near(p),i;for(i=0;i<s.crystals.length;i++)if(s.crystals[i].id===d.id)c=s.crystals[i];drag=null;if(d.moved&&c&&target&&target.id!==c.id&&target.level===c.level)merge(c,target);else if(d.moved&&c){c.x=Math.max(.08,Math.min(.92,p.x/W));c.y=Math.max(.12,Math.min(.85,p.y/H));save()}else if(c){gain(2+s.up.touch*2+Math.pow(2,c.level));say("Shard collected")}});cv.addEventListener("pointercancel",function(){drag=null});paint();stats();save();setInterval(function(){var n=flow();s.essence+=n;s.lifetime+=n;s.last=Date.now();stats();if(tab==="goals")paint();save()},1000);requestAnimationFrame(draw)}
try{start()}catch(e){$("fatal").style.display="block";$("fatal").textContent="Game startup error: "+(e&&e.message?e.message:"unknown error");}
})();
</script></body></html>
